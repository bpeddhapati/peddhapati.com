<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Theater · Bhaskar Peddhapati</title>
<meta name="description" content="Bhaskar Peddhapati: photos of the home theater build.">
<meta name="theme-color" content="#232323">
<link rel="icon" href="https://live.staticflickr.com/65535/51396718588_cb6d52a946_n.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&family=Roboto:wght@300;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#232323; --ink:#ecebe6; --body:#cfcec8; --muted:#8f8f89;
  --hair:rgba(236,235,230,.14); --line:rgba(236,235,230,.42);
  --sans:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); }
body {
  color:var(--ink);
  font-family:var(--sans);
  font-weight:300;
  font-size:1.08rem;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body.lb-open { overflow:hidden; }
a { color:inherit; }
:focus-visible { outline:1px solid var(--ink); outline-offset:5px; }
.label { font-size:.72rem; font-weight:400; letter-spacing:.38em; text-transform:uppercase; color:var(--muted); margin:0; }

main { max-width:1600px; margin:0 auto; }
.page { min-height:100vh; min-height:100svh; display:flex; flex-direction:column; animation:rise .8s var(--ease) both; }
@keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

.bar {
  display:flex; justify-content:space-between; align-items:center;
  padding:2rem 8%;
  border-bottom:1px solid var(--hair);
}
.bar .mark { font-size:.72rem; font-weight:400; letter-spacing:.42em; text-transform:uppercase; text-decoration:none; }
.bar .close, .back {
  font-size:.72rem; font-weight:400; letter-spacing:.38em; text-transform:uppercase;
  text-decoration:none; color:var(--muted); transition:color .3s var(--ease);
}
.bar .close:hover, .back:hover { color:var(--ink); }

.content { flex:1; padding:clamp(3.5rem,10vh,6.5rem) 8% 5rem; }
.wrap { max-width:1280px; margin:0 auto; }
h2 {
  margin:0 0 3rem;
  font-weight:300;
  font-size:clamp(2.6rem,6.5vw,4.8rem);
  line-height:1;
  letter-spacing:-.04em;
}
.sub { margin:-1.6rem 0 3rem; color:var(--muted); max-width:56ch; }

/* photo grid: same tiles as the album page */
.grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1.25rem; }
@media (max-width:1000px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
@media (max-width:760px)  { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:.8rem; } }
.tile {
  position:relative; display:block; aspect-ratio:16 / 9; overflow:hidden;
  padding:0; border:0; cursor:zoom-in; width:100%;
  background:linear-gradient(155deg,#3a3a38 0%,#1c1c1b 100%);
}
.tile img {
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  opacity:0; transition:opacity .8s var(--ease), transform 1.2s var(--ease);
}
.tile img.loaded { opacity:1; }
.tile:hover img, .tile:focus-visible img { transform:scale(1.05); }
.tile:focus-visible { outline:1px solid var(--ink); outline-offset:4px; }

/* frosted caption band (same as the photo albums page) */
.tile .cap {
  position:absolute; left:0; right:0; bottom:10%; z-index:2;
  height:24%; min-height:2.6rem;
  display:flex; align-items:center; justify-content:center;
  padding:0 1.4rem;
  background:rgba(224,224,221,.38);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  color:#fff;
  transition:background .45s var(--ease);
}
.tile:hover .cap, .tile:focus-visible .cap { background:rgba(236,236,233,.56); }
.tile:hover .name, .tile:focus-visible .name { font-weight:700; }
.tile .name {
  font-family:"Roboto","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:300; font-size:clamp(.865rem,1.034vw,1.053rem); line-height:1.15; letter-spacing:.01em;
  text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.35);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

/* section labels: previous home / current home */
.group { margin:0 0 1.25rem; }
.grid + .group { margin-top:3.5rem; }

.status { color:var(--muted); font-size:.95rem; max-width:60ch; }
.status code { color:var(--body); font-size:.9em; }

.back { display:inline-block; margin-top:4rem; }
footer { padding:2rem 8% calc(2.5rem + env(safe-area-inset-bottom)); border-top:1px solid var(--hair); text-align:right; }

/* lightbox */
.lb {
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  background:rgba(12,12,12,.96);
  opacity:0; visibility:hidden; transition:opacity .35s var(--ease), visibility .35s;
}
.lb.open { opacity:1; visibility:visible; }
.lb figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:1rem; max-width:92vw; }
.lb img { display:block; max-width:92vw; max-height:82vh; max-height:82svh; width:auto; height:auto; object-fit:contain; box-shadow:0 10px 40px rgba(0,0,0,.6); }
.lb figcaption { font-size:.72rem; font-weight:400; letter-spacing:.38em; text-transform:uppercase; color:var(--muted); }
.lb button {
  position:absolute; background:none; border:0; color:var(--muted); cursor:pointer;
  font-family:var(--sans); transition:color .3s var(--ease);
}
.lb button:hover { color:var(--ink); }
.lb .lb-close { top:1.6rem; right:8%; font-size:.72rem; font-weight:400; letter-spacing:.38em; text-transform:uppercase; padding:.5rem 0; }
.lb .lb-prev, .lb .lb-next { top:50%; transform:translateY(-50%); font-size:2.2rem; font-weight:200; padding:1rem 1.4rem; line-height:1; }
.lb .lb-prev { left:1%; }
.lb .lb-next { right:1%; }

@media (max-width:820px) and (orientation:portrait) {
  .bar { padding:1.5rem 8%; }
  .bar .mark, .bar .close { letter-spacing:.28em; }
  .content { padding:3rem 8% 4rem; }
  h2 { margin-bottom:2.2rem; }
  .sub { margin:-1rem 0 2.2rem; }
  .lb .lb-prev, .lb .lb-next { top:auto; bottom:2rem; transform:none; }
}
@media (max-width:560px) {
  .bar .mark, .bar .close { font-size:.64rem; letter-spacing:.22em; }
  .grid { grid-template-columns:min(100%,400px); justify-content:center; gap:1rem; }
  .tile .name { font-size:1.034rem; }
  .group { text-align:center; }
}
@media (orientation:landscape) and (max-height:480px) {
  .grid { grid-template-columns:repeat(4,minmax(0,1fr)); gap:.75rem; }
  .tile .cap { min-height:2.2rem; padding:0 .8rem; }
  .tile .name { font-size:.893rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition:none !important; animation:none !important; scroll-behavior:auto !important; }
}
</style>
</head>
<body>
<main>
  <section class="page" aria-labelledby="ht-h">
    <div class="bar">
      <a class="mark" href="index.html">Bhaskar Peddhapati</a>
      <a class="close" href="index.html">Close&nbsp;&nbsp;×</a>
    </div>
    <div class="content">
      <div class="wrap">
        <h2 id="ht-h">home theater.</h2>
        <p class="sub">Click any photo to view it full size.</p>
        <div id="gallery"></div>
        <p class="status" id="status">Loading photos…</p>
        <a class="back" href="index.html">← Back</a>
      </div>
    </div>
    <footer><p class="label"><span class="yr"></span> Bhaskar Peddhapati</p></footer>
  </section>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">
  <button class="lb-close" type="button">Close&nbsp;&nbsp;×</button>
  <button class="lb-prev" type="button" aria-label="Previous photo">‹</button>
  <figure>
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
  <button class="lb-next" type="button" aria-label="Next photo">›</button>
</div>

<!-- Backup copy of home-theater-pictures.json, used only if that file can't be read.
     The JSON file always wins when it loads, so it is the one to edit. -->
<script type="application/json" id="photo-list">
{
  "photos": [
    { "file": "1-DSC_6336-Edited.jpg",  "caption": "The Finished Basement",   "group": "Our Previous Home" },
    { "file": "2-DSC_4882-Edited.jpg",  "caption": "Welcome to the Theatre",  "group": "Our Previous Home" },
    { "file": "3-DSC_8576-Edited.jpg",  "caption": "Showtime",                "group": "Our Previous Home" },
    { "file": "4-DSC_8573-Edited.jpg",  "caption": "Lights Up",               "group": "Our Previous Home" },

    { "file": "11-DSC_7683-Edited.jpg", "caption": "4K HDR & Dolby Atmos",    "group": "Our Current Home" },
    { "file": "12-DSC_7633-Edited.jpg", "caption": "The Bar Row",             "group": "Our Current Home" },
    { "file": "13-DSC_7612-Edited.jpg", "caption": "From the Back Row",       "group": "Our Current Home" },
    { "file": "14-DSC_7670-Edited.jpg", "caption": "Front Row Recliners",     "group": "Our Current Home" },
    { "file": "15-Home Theater Rack.jpg", "caption": "The Equipment Rack",    "group": "Our Current Home" }
  ]
}
</script>

<script>
document.querySelectorAll(".yr").forEach(function (el) { el.textContent = "© " + new Date().getFullYear(); });

(function () {
  /* Photos and captions come from home-theater-pictures.json:
     { "photos": [ { "file": "name.jpg", "caption": "Text", "group": "Section" }, ... ] }
     Shown in the order listed; "caption" and "group" are optional.
     The page looks for the JSON in pictures/home-theater/ and in its own folder,
     and loads each photo from the folder the JSON was found in. */
  var JSON_NAME = "home-theater-pictures.json";
  var FOLDERS = ["./pictures/home-theater/", "./"];
  var IMG = /\.(jpe?g|png|webp|avif|gif)$/i;

  var gallery = document.getElementById("gallery");
  var status = document.getElementById("status");
  var photos = [];

  function folderUrl(f) { return new URL(f, location.href).href; }

  var io = "IntersectionObserver" in window ? new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      var img = e.target.querySelector("img");
      img.src = img.getAttribute("data-src");
      io.unobserve(e.target);
    });
  }, { rootMargin: "300px" }) : null;

  function makeTile(p) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tile";
    b.setAttribute("aria-label", p.caption ? "View photo: " + p.caption : "View photo");
    var img = document.createElement("img");
    img.alt = "";
    img.decoding = "async";
    img.setAttribute("data-src", p.src);
    img.onload = function () { img.classList.add("loaded"); };
    img.onerror = function () {
      if (window.console) console.warn("Photo not found:", p.src);
      b.remove(); var k = photos.indexOf(p); if (k > -1) photos.splice(k, 1);
    };
    b.appendChild(img);
    if (p.caption) {
      var cap = document.createElement("span");
      cap.className = "cap";
      var name = document.createElement("span");
      name.className = "name";
      name.textContent = p.caption;
      cap.appendChild(name);
      b.appendChild(cap);
    }
    b.addEventListener("click", function () { openLb(photos.indexOf(p)); });
    if (io) io.observe(b); else img.src = p.src;
    return b;
  }

  function render() {
    var grid = null, group = null;
    photos.forEach(function (p) {
      if (!grid || p.group !== group) {
        group = p.group;
        if (group) {
          var h = document.createElement("h3");
          h.className = "label group";
          h.textContent = group;
          gallery.appendChild(h);
        }
        grid = document.createElement("div");
        grid.className = "grid";
        gallery.appendChild(grid);
      }
      grid.appendChild(makeTile(p));
    });
  }

  /* Turn the JSON into photo entries, with each file resolved against `base`. */
  function parse(data, base) {
    var list = Array.isArray(data) ? data : (data.photos || data.files || data.pictures || []);
    return list.map(function (item) {
      return typeof item === "string" ? { file: item } : (item || {});
    }).filter(function (item) {
      return item.file && IMG.test(item.file);
    }).map(function (item) {
      return { src: new URL(encodeURIComponent(item.file), base).href, caption: item.caption || "", group: item.group || "" };
    });
  }

  /* Try each folder in turn until the JSON is found. */
  function findManifest(i) {
    if (i >= FOLDERS.length) return Promise.reject(new Error("not found"));
    var base = folderUrl(FOLDERS[i]);
    return fetch(base + JSON_NAME, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (data) { return parse(data, base); })
      .catch(function () { return findManifest(i + 1); });
  }

  /* Backup list in this page (see the bottom of the file). Used only when the JSON
     can't be read, e.g. when the page is opened straight from disk (file://),
     where browsers block reading JSON files. Picks whichever folder has the photos. */
  function fromBackup() {
    var el = document.getElementById("photo-list");
    if (!el) return Promise.reject(new Error("no backup"));
    var data = JSON.parse(el.textContent);
    var first = parse(data, folderUrl(FOLDERS[0]))[0];
    if (!first) return Promise.reject(new Error("empty backup"));
    function probe(i) {
      if (i >= FOLDERS.length) return Promise.reject(new Error("photos not found"));
      var base = folderUrl(FOLDERS[i]);
      var test = parse(data, base)[0].src;
      return new Promise(function (ok, no) {
        var im = new Image(); im.onload = ok; im.onerror = no; im.src = test;
      }).then(function () { return parse(data, base); }, function () { return probe(i + 1); });
    }
    return probe(0);
  }

  function fail() {
    status.innerHTML = "No photos found. Put <code>" + JSON_NAME + "</code> and the photos in " +
      "<code>pictures/home-theater/</code> next to this page (or all in the same folder as this page)." +
      (location.protocol === "file:" ? " This page was opened directly from disk; browsers block reading JSON files that way, so view it through your web server instead." : "");
  }

  findManifest(0).catch(fromBackup).then(function (list) {
    photos = list;
    if (!photos.length) throw new Error("none");
    status.hidden = true;
    render();
  }).catch(fail);

  /* ---------- lightbox ---------- */
  var lb = document.getElementById("lb");
  var lbImg = document.getElementById("lb-img");
  var lbCap = document.getElementById("lb-cap");
  var current = 0, lastFocus = null;

  function showPhoto(i) {
    current = (i + photos.length) % photos.length;
    var p = photos[current];
    lbImg.src = p.src;
    lbImg.alt = p.caption || "Home theater photo " + (current + 1);
    lbCap.textContent = (p.caption ? p.caption + "  ·  " : "") + (current + 1) + " / " + photos.length;
    [photos[current + 1], photos[current - 1]].forEach(function (n) { if (n) new Image().src = n.src; });
  }
  function openLb(i) {
    if (i < 0 || !photos.length) return;
    lastFocus = document.activeElement;
    showPhoto(i);
    lb.classList.add("open");
    lb.setAttribute("aria-hidden", "false");
    document.body.classList.add("lb-open");
    lb.querySelector(".lb-close").focus();
  }
  function closeLb() {
    lb.classList.remove("open");
    lb.setAttribute("aria-hidden", "true");
    document.body.classList.remove("lb-open");
    if (lastFocus) lastFocus.focus();
  }

  lb.querySelector(".lb-close").addEventListener("click", closeLb);
  lb.querySelector(".lb-prev").addEventListener("click", function () { showPhoto(current - 1); });
  lb.querySelector(".lb-next").addEventListener("click", function () { showPhoto(current + 1); });
  lb.addEventListener("click", function (e) { if (e.target === lb) closeLb(); });

  document.addEventListener("keydown", function (e) {
    if (lb.classList.contains("open")) {
      if (e.key === "Escape") closeLb();
      else if (e.key === "ArrowRight") showPhoto(current + 1);
      else if (e.key === "ArrowLeft") showPhoto(current - 1);
    } else if (e.key === "Escape") {
      location.href = "index.html";
    }
  });

  /* swipe on touch screens */
  var x0 = null;
  lb.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) showPhoto(current + (dx < 0 ? 1 : -1));
    x0 = null;
  });
})();
</script>
</body>
</html>
